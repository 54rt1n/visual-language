<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="vl-title vl-description">
  <title id="vl-title">Visual Language</title>
  <desc id="vl-description">The project name beside a small conversation graph. The Mandarin greeting 你好 branches into its characters 你 and 好, with pinyin below each. 好 is selected in mint green.</desc>
  <defs>
    <pattern id="vl-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#7aa2f7" opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="1000" height="320" rx="24" fill="#12141a"/>
  <rect x="552" y="20" width="420" height="280" rx="20" fill="url(#vl-grid)"/>

  <text x="52" y="180" fill="#e8eaed" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="56" font-weight="650" letter-spacing="-2">Visual <tspan fill="#a9c7ff">Language</tspan></text>

  <!-- A phrase becomes two connected word nodes. -->
  <g fill="none" stroke="#7aa2f7" stroke-width="2.5" stroke-linecap="round">
    <path d="M762 132 V146 C762 165 665 161 665 186 V196"/>
    <path d="M762 132 V146 C762 165 859 161 859 186 V196"/>
  </g>

  <rect x="662" y="40" width="200" height="92" rx="14" fill="#1a1d26" stroke="#7aa2f7" stroke-width="1.5"/>
  <g font-family="'Noto Sans CJK SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <text x="762" y="87" fill="#edf2fc" font-size="36" lang="zh-Hans">你好</text>
    <text x="762" y="114" fill="#b4c4df" font-size="18">nǐ hǎo</text>
  </g>

  <rect x="600" y="196" width="130" height="88" rx="14" fill="#1a1d26" stroke="#465773" stroke-width="1.5"/>
  <g font-family="'Noto Sans CJK SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <text x="665" y="243" fill="#edf2fc" font-size="34" lang="zh-Hans">你</text>
    <text x="665" y="270" fill="#b4c4df" font-size="18">nǐ</text>
  </g>

  <rect x="794" y="196" width="130" height="88" rx="14" fill="#18332e" stroke="#79d6bd" stroke-width="1.8"/>
  <g font-family="'Noto Sans CJK SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <text x="859" y="243" fill="#c7f4e8" font-size="34" lang="zh-Hans">好</text>
    <text x="859" y="270" fill="#9fdacb" font-size="18">hǎo</text>
  </g>

  <g stroke="#12141a" stroke-width="3">
    <circle cx="762" cy="132" r="5" fill="#7aa2f7"/>
    <circle cx="665" cy="196" r="5" fill="#7aa2f7"/>
    <circle cx="859" cy="196" r="5" fill="#79d6bd"/>
  </g>
</svg>
